<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b18"><title>Quantum.K App</title><style>body{margin:0;background:#070914;color:#eef;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px}h1{font-size:42px}section{background:#11162b;border:1px solid #293052;border-radius:18px;padding:20px;margin:16px 0}button{background:#7657ff;color:white;border:0;border-radius:12px;padding:12px 16px}input{width:75%;padding:12px;border-radius:10px;border:1px solid #394060;background:#080b18;color:white}#chat{min-height:100px;white-space:pre-wrap}</style></head><body><main><h1>Quantum.K</h1><p>Standalone Quantum-K App</p><section><h2>KI-Workspace</h2><div id="chat">Bereit. Stelle eine Frage oder beschreibe eine Idee.</div><p><input id="q" placeholder="Nachricht…"> <button onclick="send()">Senden</button></p></section><section><h2>Module</h2><p>Quantum Workspace · KI-Chat · Social Layer · Projektzentrale</p></section></main><script>function send(){let q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('chat').textContent='Du: '+q+'\n\nQuantum.K: Anfrage lokal angenommen. Für echte KI-Antworten kann ein sicherer Backend-Endpunkt verbunden werden.';document.getElementById('q').value=''}</script></body></html>
